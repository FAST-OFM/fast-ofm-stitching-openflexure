[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "fast-ofm-stitching-openflexure"
version = "0.1.0.dev0"
description = "Replaceable LGPL OpenFlexure stitching worker for Fast OFM"
requires-python = ">=3.11"
license = "LGPL-3.0-only"
license-files = ["LICENSE"]
authors = [{name = "Alexander Fridman", email = "AlexFridman@outlook.com"}]
dependencies = [
  "numpy>=1.26",
  "opencv-python-headless>=4.10",
  "openflexure-stitching==0.3.1",
  "Pillow>=10",
  "pyvips>=2.2",
]

[project.optional-dependencies]
validation = ["pytest>=8", "pytest-mock>=3.14"]

[project.scripts]
fast-ofm-stitch-openflexure = "fast_ofm_stitching_openflexure.pyramidal:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]
